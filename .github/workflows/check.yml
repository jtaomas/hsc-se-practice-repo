name: check
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: for f in public/*.js api/*.js; do node --check "$f"; done
      - name: Account API test (stubbed storage)
        run: sh tests/run_auth_test.sh
      - name: Progress and account isolation regression tests
        run: node tests/sync_test.js
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/python-runtime" --no-save --ignore-scripts pyodide@0.26.4
      - name: Browser and Python worker tests (local fixtures only)
        run: PYODIDE_DIR="$RUNNER_TEMP/python-runtime/node_modules/pyodide" python tests/run_ui_test.py
