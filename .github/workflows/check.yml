name: check
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Syntax check
        run: for f in public/*.js api/*.js; do node --check "$f"; done
      - name: Account API test (stubbed storage)
        run: sh tests/run_auth_test.sh
