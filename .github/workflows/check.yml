name: check
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install locked server SDK for offline transport tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: for f in public/*.js public/marking/*.js api/*.js server/*.js scripts/*.js; do node --check "$f"; done
      - name: Question bank check
        run: node tests/check_banks.js
      - name: Account API test (stubbed storage)
        run: sh tests/run_auth_test.sh
      - name: Progress and account isolation regression tests
        run: node tests/sync_test.js
      - name: Marking evidence, blind assessment and API regressions (no network)
        run: |
          node tests/assessment_audit_test.js
          node tests/marking_input_test.js
          node tests/deployment_bundle_test.js
          node tests/marking_engine_test.js
          node tests/marking_api_test.js
          node tests/marking_client_test.js
          node tests/feedback_client_test.js
          node tests/improvement_input_test.js
          node tests/improvement_engine_test.js
          node tests/improvement_api_test.js
          node tests/improvement_evaluator_test.js
          node tests/marking_evaluator_test.js
          node tests/marking_summary_test.js
          node scripts/evaluate-marking.js --validate --split all
          sh tests/run_marking_store_test.sh
          node tests/marking_storage_transport_test.js
          node tests/marking_blob_sdk_test.js
      - name: Comparison evidence, agent audit, sharing and regression harness (no network)
        run: npm run test:comparison
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/python-runtime" --no-save --ignore-scripts pyodide@0.26.4
          npm install --prefix "$RUNNER_TEMP/ace-runtime" --no-save --ignore-scripts ace-builds@1.32.9
      - name: Browser and Python worker tests (local fixtures only)
        run: ACE_DIR="$RUNNER_TEMP/ace-runtime/node_modules/ace-builds" PYODIDE_DIR="$RUNNER_TEMP/python-runtime/node_modules/pyodide" python tests/run_ui_test.py
